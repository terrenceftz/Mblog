# cs.mboker.cn 生产站点配置（宿主 Nginx，80/443）
# 注意：本配置是线上实际使用的宿主 Nginx 配置，与 docker-compose 部署的 deploy/nginx/nginx.conf 不同
# 部署位置：/etc/nginx/sites-available/cs-mboker-cn（sites-enabled 软链）
# 服务端口：/api -> localhost:3003（PM2 mblog-api）、/ -> localhost:4322（PM2 mblog-site）
# 后台 SPA 静态文件：/var/www/cs.mboker.cn/admin/（构建产物拷贝部署）
#
# 缓存策略（map 按 $uri 分发，随 try_files 内部重定向后的 $uri 求值）：
# - /admin/assets/ 与 /_astro/ 为内容哈希资源 -> immutable 长缓存 1 年，发版换哈希自动失效
# - /uploads/ 上传文件基本不可变 -> 短缓存 1 天
# - 其余（HTML / API）-> no-cache，浏览器每次重新验证，避免缓存旧 HTML 引用已删除的旧哈希资源
#
# 压缩：服务器主 nginx.conf 已全局 gzip on（http 层），本文件只扩展压缩类型——
# 默认类型不含 application/json / woff2，API JSON 与字体是流量大头，这里补全。
# 注意：不要再加 gzip on;（会与全局重复，nginx -t 报 duplicate）
# 安全头：add_header 不向下继承——server 级 + 每个带 add_header 的 location 都需声明一遍

gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any; # 压缩 nginx 代理的响应（/api、/uploads 反代后端；默认 off 不会压缩代理响应）
gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/rss+xml image/svg+xml font/woff2;

map $uri $mblog_cache_control {
    ~^/admin/assets/            "public, max-age=31536000, immutable";
    ~^/_astro/                  "public, max-age=31536000, immutable";
    ~^/uploads/                 "public, max-age=86400";
    default                     "no-cache";
}

server {
    listen 80;
    server_name cs.mboker.cn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cs.mboker.cn;

    ssl_certificate /etc/letsencrypt/live/cs.mboker.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cs.mboker.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 安全头（server 级，location 未自带 add_header 时生效）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 后台管理 SPA：HTML no-cache，哈希资源 immutable
    # 注意：此处不可用 alias+正则 location 拆分（try_files 按 root+$uri 拼路径，与 alias 冲突），
    # 直接由 map 在单 location 内按 $uri 分发缓存头
    location /admin/ {
        alias /var/www/cs.mboker.cn/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control $mblog_cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 后端 API（不缓存）
    location /api/ {
        proxy_pass http://localhost:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;
        # 后端已自带安全头 → 隐藏上游，避免与本层 add_header 重复（nginx 统一下发）
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 上传文件（短缓存 1 天；隐藏上游 Cache-Control，避免重复头）
    location /uploads/ {
        proxy_pass http://localhost:3003;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control $mblog_cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Astro 前台 SSR：页面 no-cache，/_astro/ 哈希资源 immutable
    location / {
        proxy_pass http://localhost:4322;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $mblog_cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

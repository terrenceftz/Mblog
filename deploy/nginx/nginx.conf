# MBLOG docker-compose 部署版 Nginx 配置
# 说明：线上 cs.mboker.cn 实际使用的是宿主 Nginx（deploy/nginx/sites-available/cs-mboker-cn.conf），
#       本文件是 docker-compose（mblog-web）部署形态的等价配置，缓存策略保持一致。
#
# 缓存策略（map 按 $uri 分发，随 try_files 内部重定向后的 $uri 求值）：
# - /admin/assets/ 与 /_astro/ 为内容哈希资源 -> immutable 长缓存 1 年，发版换哈希自动失效
# - /uploads/ 上传文件基本不可变 -> 短缓存 1 天
# - 其余（HTML / API）-> no-cache，浏览器每次重新验证，避免缓存旧 HTML 引用已删除的旧哈希资源
#
# 压缩 + 安全头（本版走 HTTP，无 HSTS；若前面再挂 TLS 网关请在网关加 HSTS）

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/rss+xml image/svg+xml font/woff2;

map $uri $mblog_cache_control {
    ~^/admin/assets/            "public, max-age=31536000, immutable";
    ~^/_astro/                  "public, max-age=31536000, immutable";
    ~^/uploads/                 "public, max-age=86400";
    default                     "no-cache";
}

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 后台 SPA（静态文件 + history 路由回退）：HTML no-cache，哈希资源 immutable
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control $mblog_cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # 后端 API（不缓存）
    location /api/ {
        proxy_pass http://mblog-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 60m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # 本地存储的上传文件（短缓存 1 天；隐藏上游 Cache-Control，避免重复头）
    location /uploads/ {
        proxy_pass http://mblog-api:3000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $mblog_cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Astro 前台（SSR）：页面 no-cache，/_astro/ 哈希资源 immutable
    location / {
        proxy_pass http://mblog-site:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $mblog_cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
